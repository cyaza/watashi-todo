<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたしのToDoList</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f5f0e8;
      --surface:  #faf7f2;
      --border:   #d9cfc0;
      --accent:   #7a9e7e;
      --accent2:  #b5836a;
      --text:     #3d3530;
      --muted:    #9b8f84;
      --done:     #b8b0a6;
      --shadow:   rgba(100,80,60,0.10);
    }

    body {
      font-family: 'Klee One', 'YuKyokasho', cursive;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
    }

    /* ─── Header ─── */
    .site-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .site-header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--text);
    }
    .site-header .subtitle {
      font-size: .95rem;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: .06em;
    }

    /* ─── Card ─── */
    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 4px 18px var(--shadow);
      padding: 28px 30px;
      width: 100%;
      max-width: 520px;
    }

    /* ─── Date bar ─── */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .date-label {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: .05em;
    }
    .btn-calendar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 7px 16px;
      font-family: inherit;
      font-size: .9rem;
      cursor: pointer;
      transition: background .2s, transform .1s;
      letter-spacing: .06em;
    }
    .btn-calendar:hover { background: #6a8e6e; transform: translateY(-1px); }
    .btn-calendar svg { width: 16px; height: 16px; }

    /* ─── Input row ─── */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .input-row input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .input-row input:focus { border-color: var(--accent); }
    .input-row input::placeholder { color: var(--muted); }
    .btn-add {
      background: var(--accent2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: background .2s, transform .1s;
      white-space: nowrap;
      letter-spacing: .05em;
    }
    .btn-add:hover { background: #a07060; transform: translateY(-1px); }

    /* ─── Todo list ─── */
    .todo-list { list-style: none; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px dashed var(--border);
      animation: fadeIn .25s ease;
    }
    .todo-item:last-child { border-bottom: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

    .todo-check {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, border-color .2s;
    }
    .todo-check.checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .todo-check.checked::after {
      content: '';
      width: 10px; height: 6px;
      border-left: 2.5px solid #fff;
      border-bottom: 2.5px solid #fff;
      transform: rotate(-45deg) translateY(-1px);
      display: block;
    }
    .todo-text {
      flex: 1;
      font-size: 1rem;
      line-height: 1.5;
      transition: color .2s;
    }
    .todo-text.done {
      color: var(--done);
      text-decoration: line-through;
      text-decoration-color: var(--done);
    }
    .btn-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color .2s, background .2s;
      line-height: 1;
    }
    .btn-del:hover { color: #c0392b; background: #fdf0ee; }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
      padding: 24px 0 8px;
      letter-spacing: .04em;
    }

    /* ─── All done toast ─── */
    .all-done-toast {
      display: none;
      margin-top: 18px;
      background: linear-gradient(135deg, #f0f7f0, #fdf6ee);
      border: 1.5px solid #b5d6b8;
      border-radius: 14px;
      padding: 16px 20px;
      text-align: center;
      animation: toastIn .4s cubic-bezier(.22,1,.36,1);
    }
    .all-done-toast.show { display: block; }
    @keyframes toastIn {
      from { opacity: 0; transform: scale(.95) translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    .all-done-emoji { font-size: 1.6rem; margin-bottom: 6px; }
    .all-done-text {
      font-size: .95rem;
      color: var(--text);
      line-height: 1.8;
      letter-spacing: .04em;
      white-space: pre-line;
    }

    /* ─── Animal illustrations ─── */
    .animal-stage {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      overflow: hidden;
    }
    .animal {
      position: absolute;
      bottom: -160px;
      font-size: 80px;
      opacity: 0;
      transition: none;
      filter: drop-shadow(0 4px 12px rgba(100,80,60,.15));
      user-select: none;
    }
    .animal.rise {
      animation: animalRise 3s cubic-bezier(.22,1,.36,1) forwards;
    }
    .animal.fall {
      animation: animalFall 1.2s ease-in forwards;
    }
    @keyframes animalRise {
      0%   { opacity: 0; transform: translateY(0) scale(.7) rotate(-4deg); }
      30%  { opacity: 1; }
      60%  { transform: translateY(-180px) scale(1.05) rotate(3deg); }
      80%  { transform: translateY(-200px) scale(1) rotate(-1deg); }
      100% { opacity: 1; transform: translateY(-200px) scale(1) rotate(0deg); }
    }
    @keyframes animalFall {
      0%   { opacity: 1; transform: translateY(-200px) scale(1); }
      100% { opacity: 0; transform: translateY(-20px) scale(.8); }
    }

    /* ─── Progress bar ─── */
    .progress-wrap {
      margin-top: 20px;
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width .4s ease;
    }
    .progress-label {
      text-align: right;
      font-size: .82rem;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: .04em;
    }

    /* ─── Calendar overlay ─── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(50,40,30,.35);
      backdrop-filter: blur(3px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.open { display: flex; }

    .cal-modal {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(80,60,40,.2);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 26px;
      animation: slideUp .25s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cal-title {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: .06em;
    }
    .cal-nav {
      display: flex; align-items: center; gap: 10px;
    }
    .btn-nav {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      width: 32px; height: 32px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .btn-nav:hover { background: var(--bg); }
    .cal-month-label { font-size: 1rem; min-width: 90px; text-align: center; letter-spacing: .05em; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 18px;
    }
    .cal-dow {
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
      padding: 4px 0;
    }
    .cal-day {
      text-align: center;
      padding: 7px 2px;
      border-radius: 9px;
      cursor: pointer;
      font-size: .9rem;
      position: relative;
      transition: background .15s, color .15s;
      border: 1.5px solid transparent;
    }
    .cal-day:hover { background: var(--bg); }
    .cal-day.today { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .cal-day.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
    .cal-day.has-todos::after {
      content: '';
      width: 5px; height: 5px;
      background: var(--accent2);
      border-radius: 50%;
      position: absolute;
      bottom: 3px; left: 50%; transform: translateX(-50%);
    }
    .cal-day.selected.has-todos::after { background: rgba(255,255,255,.8); }
    .cal-day.empty { cursor: default; }

    /* ─── Day detail in modal ─── */
    .day-detail {
      border-top: 1.5px dashed var(--border);
      padding-top: 18px;
    }
    .day-detail-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
      letter-spacing: .05em;
    }
    .day-input-row {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    .day-input-row input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: .95rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .day-input-row input:focus { border-color: var(--accent); }
    .day-input-row input::placeholder { color: var(--muted); }
    .btn-day-add {
      background: var(--accent2);
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: .9rem;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    .btn-day-add:hover { background: #a07060; }

    .day-todo-list { list-style: none; }
    .day-todo-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 2px;
      border-bottom: 1px dashed var(--border);
    }
    .day-todo-item:last-child { border-bottom: none; }

    .btn-close-modal {
      display: block;
      width: 100%;
      margin-top: 20px;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 9px;
      font-family: inherit;
      font-size: .95rem;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s, color .2s;
      letter-spacing: .05em;
    }
    .btn-close-modal:hover { background: var(--bg); color: var(--text); }

    /* ─── Stats overlay ─── */
    .stats-modal {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(80,60,40,.2);
      width: 100%;
      max-width: 460px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px 28px;
      animation: slideUp .25s ease;
    }
    .stats-title {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: .08em;
      margin-bottom: 24px;
      text-align: center;
    }
    .stats-big {
      display: flex;
      justify-content: space-around;
      margin-bottom: 26px;
      gap: 12px;
    }
    .stats-num-box {
      flex: 1;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px 8px;
      text-align: center;
    }
    .stats-num {
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: .02em;
      line-height: 1.2;
    }
    .stats-num.accent2 { color: var(--accent2); }
    .stats-num-label {
      font-size: .78rem;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: .06em;
    }

    /* Rank badge */
    .rank-wrap {
      text-align: center;
      margin-bottom: 24px;
    }
    .rank-badge {
      display: inline-block;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: .06em;
      padding: 10px 28px;
      border-radius: 99px;
      margin-bottom: 6px;
    }
    .rank-badge.s  { background: #fff3d0; color: #b07a00; border: 1.5px solid #e6c96a; }
    .rank-badge.a  { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #81c784; }
    .rank-badge.b  { background: #e3f2fd; color: #1565c0; border: 1.5px solid #90caf9; }
    .rank-badge.c  { background: #f3e5f5; color: #6a1b9a; border: 1.5px solid #ce93d8; }
    .rank-badge.d  { background: var(--bg); color: var(--muted); border: 1.5px solid var(--border); }
    .rank-comment {
      font-size: .9rem;
      color: var(--muted);
      letter-spacing: .05em;
    }

    /* Ring chart */
    .ring-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }
    .ring-svg { overflow: visible; }
    .ring-bg { fill: none; stroke: var(--border); }
    .ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
    .ring-text-pct { font-family: 'Klee One', cursive; font-size: 20px; font-weight: 600; fill: var(--text); }
    .ring-text-sub { font-family: 'Klee One', cursive; font-size: 9px; fill: var(--muted); }

    /* Recent days bar chart */
    .chart-section { margin-bottom: 6px; }
    .chart-title {
      font-size: .88rem;
      color: var(--muted);
      letter-spacing: .06em;
      margin-bottom: 10px;
    }
    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 70px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      height: 100%;
      justify-content: flex-end;
    }
    .bar-fill {
      width: 100%;
      border-radius: 5px 5px 0 0;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      min-height: 3px;
      transition: height .4s ease;
    }
    .bar-label {
      font-size: .7rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .bar-pct {
      font-size: .68rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  </style>
</head>
<body>

<div class="animal-stage" id="animalStage"></div>

<header class="site-header">
  <h1>わたしのToDoList</h1>
  <p class="subtitle">今日もひとつずつ、丁寧に。</p>
</header>

<div class="card">
  <!-- Date bar -->
  <div class="date-bar">
    <span class="date-label" id="todayLabel"></span>
    <div style="display:flex;gap:8px;">
      <button class="btn-calendar" id="btnOpenStats" style="background:var(--accent2);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        総合評価
      </button>
      <button class="btn-calendar" id="btnOpenCal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        カレンダー
      </button>
    </div>
  </div>

  <!-- Input -->
  <div class="input-row">
    <input type="text" id="todoInput" placeholder="やることを入力してください…" maxlength="80">
    <button class="btn-add" id="btnAdd">追加</button>
  </div>

  <!-- List -->
  <ul class="todo-list" id="todoList"></ul>
  <p class="empty-msg" id="emptyMsg" style="display:none">まだ何もありません ✦</p>

  <!-- All done message -->
  <div class="all-done-toast" id="allDoneToast">
    <div class="all-done-emoji" id="allDoneEmoji"></div>
    <div class="all-done-text" id="allDoneText"></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <p class="progress-label" id="progressLabel"></p>
</div>

<!-- Stats overlay -->
<div class="overlay" id="statsOverlay">
  <div class="stats-modal">
    <p class="stats-title">✦ 総合評価 ✦</p>

    <div class="stats-big">
      <div class="stats-num-box">
        <div class="stats-num" id="statTotal">0</div>
        <div class="stats-num-label">総タスク数</div>
      </div>
      <div class="stats-num-box">
        <div class="stats-num" id="statDone">0</div>
        <div class="stats-num-label">完了タスク</div>
      </div>
      <div class="stats-num-box">
        <div class="stats-num accent2" id="statDays">0</div>
        <div class="stats-num-label">記録した日数</div>
      </div>
    </div>

    <div class="ring-wrap">
      <svg class="ring-svg" width="120" height="120" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="46" stroke-width="10"/>
        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="46" stroke-width="10"
          stroke="url(#ringGrad)"
          stroke-dasharray="289"
          stroke-dashoffset="289"
          transform="rotate(-90 60 60)"/>
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7a9e7e"/>
            <stop offset="100%" stop-color="#b5836a"/>
          </linearGradient>
        </defs>
        <text class="ring-text-pct" id="ringPct" x="60" y="56" text-anchor="middle" dominant-baseline="middle">0%</text>
        <text class="ring-text-sub" x="60" y="70" text-anchor="middle">達成率</text>
      </svg>
    </div>

    <div class="rank-wrap">
      <div class="rank-badge" id="rankBadge">—</div>
      <p class="rank-comment" id="rankComment"></p>
    </div>

    <div class="chart-section">
      <p class="chart-title">直近7日間の達成率</p>
      <div class="bar-chart" id="barChart"></div>
    </div>

    <button class="btn-close-modal" id="btnCloseStats">閉じる</button>
  </div>
</div>

<!-- Calendar overlay -->
<div class="overlay" id="calOverlay">
  <div class="cal-modal">
    <div class="cal-header">
      <span class="cal-title">カレンダー</span>
      <div class="cal-nav">
        <button class="btn-nav" id="btnPrevMonth">&#8249;</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="btn-nav" id="btnNextMonth">&#8250;</button>
      </div>
    </div>

    <div class="cal-grid" id="calGrid"></div>

    <div class="day-detail" id="dayDetail" style="display:none">
      <p class="day-detail-title" id="dayDetailTitle"></p>
      <div class="day-input-row">
        <input type="text" id="dayTodoInput" placeholder="この日のやることを追加…" maxlength="80">
        <button class="btn-day-add" id="btnDayAdd">追加</button>
      </div>
      <ul class="day-todo-list" id="dayTodoList"></ul>
    </div>

    <button class="btn-close-modal" id="btnCloseModal">閉じる</button>
  </div>
</div>

<script>
  // ─── Storage helpers ───
  const KEY = 'watashi_todo_v1';
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
  }
  function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

  // ─── Date helpers ───
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function formatDate(key) {
    const [y,m,d] = key.split('-').map(Number);
    const days = ['日','月','火','水','木','金','土'];
    const dow = days[new Date(y,m-1,d).getDay()];
    return `${y}年${m}月${d}日（${dow}）`;
  }

  // ─── Today label ───
  const todayLabelEl = document.getElementById('todayLabel');
  todayLabelEl.textContent = formatDate(todayKey());

  // ─── Today's todo ───
  const todoInput = document.getElementById('todoInput');
  const btnAdd = document.getElementById('btnAdd');
  const todoList = document.getElementById('todoList');
  const emptyMsg = document.getElementById('emptyMsg');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressLabel = document.getElementById('progressLabel');
  const allDoneToast = document.getElementById('allDoneToast');
  const allDoneEmoji = document.getElementById('allDoneEmoji');
  const allDoneText = document.getElementById('allDoneText');

  const PRAISE = [
    { emoji: '🌸', text: 'やりきったね。\nそれだけで今日は十分すぎるくらい。\nゆっくり休んでね。' },
    { emoji: '✨', text: '全部こなせた自分を、ちゃんと褒めてあげて。\n小さな積み重ねが、確実に未来を変えてるよ。\nお疲れさまでした。' },
    { emoji: '🍵', text: '今日のToDoList、完全制覇！\nこつこつ続けるって、実はいちばん難しいこと。\nあなたはちゃんとやり遂げたね。' },
    { emoji: '🌿', text: '全部終わったね。えらい、本当にえらい。\n今日という一日を、きちんと生きた証だよ。\nゆっくりおやすみなさい。' },
    { emoji: '🎉', text: 'やった！全部チェックできたね！\n自分との約束を守れる人は、すごく信頼できる人。\n今日の自分、かっこよかったよ。' },
    { emoji: '🌙', text: '今日も一日よく頑張った。\nリストを全部クリアできたこと、忘れないでね。\nその達成感、明日への力にして。' },
    { emoji: '☕', text: '全タスク完了、お見事！\n計画して、実行して、やりきる。\nそれができるあなたは、もう十分すごい人だよ。' },
    { emoji: '🌻', text: 'ひとつひとつ丁寧にこなしてきたんだね。\nそういう積み重ねが、いつか大きな花を咲かせる。\n今日もお疲れさまでした。' },
    { emoji: '🍀', text: '全部クリアだ、すごい！\n今日のあなたは確かに前進した。\nそのことを、どうか忘れずにいてね。' },
    { emoji: '🌈', text: 'やりたいことを全部やった日って、清々しいよね。\nそんな日を自分で作り出せるあなたは素敵だよ。\nゆっくり深呼吸して、今日を終えてね。' },
    { emoji: '🕊️', text: 'お疲れさま。全部終わったね。\n誰も見ていなくても、ちゃんと頑張ったこと、\n自分がいちばん知ってるよね。' },
    { emoji: '🌺', text: '完璧なんて目指さなくていい。\nでも今日のあなたは、全部やりきった。\nそれって、十分すごいことだよ。' },
    { emoji: '⭐', text: '今日という日を、全力で生きたんだね。\nその姿勢、本当にかっこいい。\nゆっくり自分を労ってあげてね。' },
    { emoji: '🧸', text: '全部チェックできたね、おめでとう！\n小さな達成を積み重ねるって、\n実はいちばん大切なことなんだよ。' },
    { emoji: '🍃', text: 'よくやったね。本当によくやった。\n今日のあなたの努力は、静かに、確かに実を結んでいるよ。\nゆっくり休んでね。' },
    { emoji: '💫', text: '全部終わった！それだけで今日は大成功。\n明日また新しい一日が始まるけど、\n今夜はゆっくり自分を褒めてあげて。' },
  ];

  let lastPraiseKey = null;
  let animalTimer = null;

  // ─── Animal parade ───
  const ANIMALS = ['🐰','🐻','🐼','🦊','🐨','🐸','🐧','🦔','🐹','🐶','🐱','🦁','🐮','🐷','🐭','🦦','🦥','🐿️','🦜','🐢'];

  const animalStage = document.getElementById('animalStage');

  function spawnAnimal(side) {
    const el = document.createElement('div');
    el.className = 'animal';
    const animal = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
    el.textContent = animal;

    // Position: left or right margin area
    const cardWidth = Math.min(520, window.innerWidth);
    const centerX = window.innerWidth / 2;
    const margin = (window.innerWidth - cardWidth) / 2;
    const spread = Math.max(margin - 20, 20);

    if (side === 'left') {
      el.style.left = (Math.random() * Math.max(spread - 80, 10) + 10) + 'px';
    } else {
      el.style.right = (Math.random() * Math.max(spread - 80, 10) + 10) + 'px';
    }

    // slight random size
    const size = 60 + Math.floor(Math.random() * 40);
    el.style.fontSize = size + 'px';

    animalStage.appendChild(el);
    void el.offsetWidth;
    el.classList.add('rise');

    // after rise animation hold then fade
    setTimeout(() => {
      el.classList.remove('rise');
      el.classList.add('fall');
      setTimeout(() => el.remove(), 1200);
    }, 3200 + Math.random() * 800);
  }

  function startAnimalParade() {
    stopAnimalParade();
    let count = 0;
    const total = 6 + Math.floor(Math.random() * 4); // 6〜9匹
    function next() {
      if (count >= total) return;
      const side = count % 2 === 0 ? 'left' : 'right';
      spawnAnimal(side);
      count++;
      animalTimer = setTimeout(next, 500 + Math.random() * 700);
    }
    next();
  }

  function stopAnimalParade() {
    if (animalTimer) { clearTimeout(animalTimer); animalTimer = null; }
    animalStage.innerHTML = '';
  }

  function showPraise() {
    let idx;
    do { idx = Math.floor(Math.random() * PRAISE.length); } while (idx === lastPraiseKey && PRAISE.length > 1);
    lastPraiseKey = idx;
    const p = PRAISE[idx];
    allDoneEmoji.textContent = p.emoji;
    allDoneText.textContent = p.text;
    allDoneToast.classList.remove('show');
    void allDoneToast.offsetWidth;
    allDoneToast.classList.add('show');
    startAnimalParade();
  }

  function renderToday() {
    const data = load();
    const key = todayKey();
    const items = data[key] || [];
    todoList.innerHTML = '';
    if (items.length === 0) {
      emptyMsg.style.display = 'block';
      progressWrap.style.display = 'none';
      progressLabel.textContent = '';
      allDoneToast.classList.remove('show');
      return;
    }
    emptyMsg.style.display = 'none';
    progressWrap.style.display = 'block';
    const done = items.filter(i => i.done).length;
    const pct = Math.round(done / items.length * 100);
    progressBar.style.width = pct + '%';
    progressLabel.textContent = `${done} / ${items.length} 完了 (${pct}%)`;

    // 全完了チェック
    if (done === items.length) {
      showPraise();
    } else {
      allDoneToast.classList.remove('show');
      stopAnimalParade();
    }

    items.forEach((item, idx) => {
      const li = document.createElement('li');
      li.className = 'todo-item';

      const chk = document.createElement('div');
      chk.className = 'todo-check' + (item.done ? ' checked' : '');
      chk.onclick = () => toggleToday(idx);

      const txt = document.createElement('span');
      txt.className = 'todo-text' + (item.done ? ' done' : '');
      txt.textContent = item.text;

      const del = document.createElement('button');
      del.className = 'btn-del';
      del.textContent = '✕';
      del.title = '削除';
      del.onclick = () => deleteToday(idx);

      li.append(chk, txt, del);
      todoList.appendChild(li);
    });
  }

  function addToday(text) {
    if (!text.trim()) return;
    const data = load();
    const key = todayKey();
    if (!data[key]) data[key] = [];
    data[key].push({ text: text.trim(), done: false });
    save(data);
    renderToday();
  }

  function toggleToday(idx) {
    const data = load();
    const key = todayKey();
    data[key][idx].done = !data[key][idx].done;
    save(data);
    renderToday();
  }

  function deleteToday(idx) {
    const data = load();
    const key = todayKey();
    data[key].splice(idx, 1);
    save(data);
    renderToday();
  }

  btnAdd.onclick = () => { addToday(todoInput.value); todoInput.value = ''; };
  todoInput.onkeydown = (e) => { if (e.key === 'Enter') btnAdd.click(); };

  renderToday();

  // ─── Calendar ───
  const calOverlay = document.getElementById('calOverlay');
  const btnOpenCal = document.getElementById('btnOpenCal');
  const btnCloseModal = document.getElementById('btnCloseModal');
  const calMonthLabel = document.getElementById('calMonthLabel');
  const calGrid = document.getElementById('calGrid');
  const btnPrevMonth = document.getElementById('btnPrevMonth');
  const btnNextMonth = document.getElementById('btnNextMonth');
  const dayDetail = document.getElementById('dayDetail');
  const dayDetailTitle = document.getElementById('dayDetailTitle');
  const dayTodoInput = document.getElementById('dayTodoInput');
  const btnDayAdd = document.getElementById('btnDayAdd');
  const dayTodoList = document.getElementById('dayTodoList');

  let calYear, calMonth, selectedKey = null;
  const now = new Date();

  function openCalendar() {
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedKey = null;
    dayDetail.style.display = 'none';
    renderCal();
    calOverlay.classList.add('open');
  }
  function closeCalendar() { calOverlay.classList.remove('open'); }

  btnOpenCal.onclick = openCalendar;
  btnCloseModal.onclick = closeCalendar;
  calOverlay.onclick = (e) => { if (e.target === calOverlay) closeCalendar(); };

  btnPrevMonth.onclick = () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal(); };
  btnNextMonth.onclick = () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCal(); };

  function renderCal() {
    const data = load();
    const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
    calMonthLabel.textContent = `${calYear}年 ${monthNames[calMonth]}`;

    calGrid.innerHTML = '';
    const dows = ['日','月','火','水','木','金','土'];
    dows.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      calGrid.appendChild(el);
    });

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const tKey = todayKey();

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      calGrid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(calYear, calMonth, d);
      const el = document.createElement('div');
      el.className = 'cal-day';
      if (key === tKey) el.classList.add('today');
      if (key === selectedKey) el.classList.add('selected');
      const items = data[key];
      if (items && items.length > 0) el.classList.add('has-todos');
      el.textContent = d;
      el.onclick = () => selectDay(key);
      calGrid.appendChild(el);
    }
  }

  function selectDay(key) {
    selectedKey = key;
    renderCal();
    dayDetailTitle.textContent = formatDate(key) + ' のToDoList';
    renderDayList();
    dayDetail.style.display = 'block';
    dayTodoInput.value = '';
  }

  function renderDayList() {
    const data = load();
    const items = data[selectedKey] || [];
    dayTodoList.innerHTML = '';
    if (items.length === 0) {
      const li = document.createElement('li');
      li.style.cssText = 'color:var(--muted);font-size:.9rem;padding:8px 0;letter-spacing:.04em;';
      li.textContent = 'まだ何もありません ✦';
      dayTodoList.appendChild(li);
      return;
    }
    items.forEach((item, idx) => {
      const li = document.createElement('li');
      li.className = 'day-todo-item';

      const chk = document.createElement('div');
      chk.className = 'todo-check' + (item.done ? ' checked' : '');
      chk.style.cssText = 'width:20px;height:20px;';
      chk.onclick = () => toggleDay(idx);

      const txt = document.createElement('span');
      txt.className = 'todo-text' + (item.done ? ' done' : '');
      txt.style.fontSize = '.95rem';
      txt.textContent = item.text;

      const del = document.createElement('button');
      del.className = 'btn-del';
      del.textContent = '✕';
      del.onclick = () => deleteDay(idx);

      li.append(chk, txt, del);
      dayTodoList.appendChild(li);
    });
  }

  function addDay(text) {
    if (!text.trim() || !selectedKey) return;
    const data = load();
    if (!data[selectedKey]) data[selectedKey] = [];
    data[selectedKey].push({ text: text.trim(), done: false });
    save(data);
    renderDayList();
    renderCal();
    if (selectedKey === todayKey()) renderToday();
  }

  function toggleDay(idx) {
    const data = load();
    data[selectedKey][idx].done = !data[selectedKey][idx].done;
    save(data);
    renderDayList();
    if (selectedKey === todayKey()) renderToday();
  }

  function deleteDay(idx) {
    const data = load();
    data[selectedKey].splice(idx, 1);
    save(data);
    renderDayList();
    renderCal();
    if (selectedKey === todayKey()) renderToday();
  }

  btnDayAdd.onclick = () => { addDay(dayTodoInput.value); dayTodoInput.value = ''; };
  dayTodoInput.onkeydown = (e) => { if (e.key === 'Enter') btnDayAdd.click(); };

  // ─── Stats ───
  const statsOverlay = document.getElementById('statsOverlay');
  const btnOpenStats = document.getElementById('btnOpenStats');
  const btnCloseStats = document.getElementById('btnCloseStats');

  function openStats() {
    const data = load();
    const keys = Object.keys(data);
    let totalTasks = 0, doneTasks = 0;
    keys.forEach(k => {
      const items = data[k] || [];
      totalTasks += items.length;
      doneTasks += items.filter(i => i.done).length;
    });
    const daysWithTasks = keys.filter(k => data[k] && data[k].length > 0).length;
    const pct = totalTasks > 0 ? Math.round(doneTasks / totalTasks * 100) : 0;

    document.getElementById('statTotal').textContent = totalTasks;
    document.getElementById('statDone').textContent = doneTasks;
    document.getElementById('statDays').textContent = daysWithTasks;

    // Ring
    const circumference = 289;
    const offset = circumference - (circumference * pct / 100);
    document.getElementById('ringFill').style.strokeDashoffset = circumference;
    document.getElementById('ringPct').textContent = pct + '%';
    setTimeout(() => {
      document.getElementById('ringFill').style.strokeDashoffset = offset;
    }, 50);

    // Rank
    const rankEl = document.getElementById('rankBadge');
    const commentEl = document.getElementById('rankComment');
    let rank, cls, comment;
    if (pct >= 90)      { rank = 'S ランク 🌟'; cls = 's'; comment = '素晴らしい！完璧に近い達成率です。'; }
    else if (pct >= 75) { rank = 'A ランク ✨'; cls = 'a'; comment = 'とても頑張っています！その調子！'; }
    else if (pct >= 55) { rank = 'B ランク 🌿'; cls = 'b'; comment = 'いい感じです。もう少しで上のランクへ。'; }
    else if (pct >= 35) { rank = 'C ランク 🌱'; cls = 'c'; comment = '少しずつ積み重ねていきましょう。'; }
    else                { rank = 'D ランク 🌧'; cls = 'd'; comment = 'まずは小さなことから始めてみよう。'; }
    rankEl.textContent = rank;
    rankEl.className = 'rank-badge ' + cls;
    commentEl.textContent = comment;

    // Bar chart: last 7 days
    const barChart = document.getElementById('barChart');
    barChart.innerHTML = '';
    const days7 = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const label = `${d.getMonth()+1}/${d.getDate()}`;
      const items = data[k] || [];
      const total = items.length;
      const done = items.filter(x => x.done).length;
      const p = total > 0 ? Math.round(done / total * 100) : 0;
      days7.push({ label, p });
    }
    const maxP = Math.max(...days7.map(d => d.p), 1);
    days7.forEach(({ label, p }) => {
      const col = document.createElement('div');
      col.className = 'bar-col';
      const pctEl = document.createElement('div');
      pctEl.className = 'bar-pct';
      pctEl.textContent = p > 0 ? p + '%' : '';
      const bar = document.createElement('div');
      bar.className = 'bar-fill';
      bar.style.height = Math.max((p / maxP) * 56, p > 0 ? 4 : 3) + 'px';
      if (p === 0) bar.style.background = 'var(--border)';
      const lbl = document.createElement('div');
      lbl.className = 'bar-label';
      lbl.textContent = label;
      col.append(pctEl, bar, lbl);
      barChart.appendChild(col);
    });

    statsOverlay.classList.add('open');
  }

  btnOpenStats.onclick = openStats;
  btnCloseStats.onclick = () => statsOverlay.classList.remove('open');
  statsOverlay.onclick = (e) => { if (e.target === statsOverlay) statsOverlay.classList.remove('open'); };
</script>
</body>
</html>
